[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-ingest"
version = "0.1.0"
description = "Instagram sponsorship campaign extraction and drafting automation"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.9",
  "python-dateutil>=2.9",
  "openai>=1.40"
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["campaign_ingest"]

[tool.pytest.ini_options]
pythonpath = ["."]
